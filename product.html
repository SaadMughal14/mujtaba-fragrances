<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mujtaba Fragrances — Perfume Details</title>
  <meta name="description" content="Discover handcrafted luxury perfumes by Mujtaba Fragrances.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@200;300;400;500;600&display=swap">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body class="page-inner">

  <!-- ====================== NAVIGATION ====================== -->
  <nav class="nav scrolled" id="nav">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <span class="nav-logo-icon">
          <img src="assets/images/logo.svg" alt="MF Logo">
        </span>
        <span class="nav-logo-text">
          <span class="brand">Mujtaba</span>
          <span class="tagline">Fragrances</span>
        </span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="mens.html">Men</a></li>
        <li><a href="womens.html">Women</a></li>
        <li><a href="unisex.html">Unisex</a></li>
        <li><a href="cart.html">Cart</a></li>
      </ul>
      <div class="nav-actions">
        <button class="nav-icon" aria-label="Search" onclick="if(window.openSearchModal) window.openSearchModal();">
          <i class="fa-solid fa-magnifying-glass" style="font-size:14px;"></i>
        </button>
        <button type="button" class="nav-icon open-cart-drawer" aria-label="Cart" style="background:none; border:none; cursor:pointer;">
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
          <span class="cart-badge">0</span>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ====================== PRODUCT DETAIL ====================== -->
  <main class="product-detail">
    <div class="container">
      <div class="product-detail-grid" id="productDetail">
        <!-- Populated by JS -->
      </div>
    </div>
  </main>

  <div style="padding: 40px 0; text-align: center; font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 60px;">
    © 2026 MUJTABA FRAGRANCES. ALL RIGHTS RESERVED.
  </div>

  <!-- ====================== SCRIPTS ====================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script src="js/animations.js"></script>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const product = id ? window.findProduct(id) : null;

      const container = document.getElementById('productDetail');

      if (!product) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 80px 20px;">
            <h1 style="font-family: var(--font-heading); font-size: 48px; font-weight: 300; margin-bottom: 16px;">Perfume Not Found</h1>
            <p style="color: var(--text-muted); margin-bottom: 32px;">The perfume you're looking for doesn't exist or has been moved.</p>
            <a href="shop.html" class="btn btn-primary"><span>Explore All Perfumes</span></a>
          </div>
        `;
        document.title = 'Perfume Not Found — Mujtaba Fragrances';
        return;
      }

      // Apply theme based on collection
      if (product.collection === 'men') {
        document.body.classList.add('theme-mens');
      } else if (product.collection === 'women') {
        document.body.classList.add('theme-womens');
      }

      document.title = `${product.name} — Mujtaba Fragrances`;

      const sizesHtml = product.sizes.map((s, i) => `
        <button class="size-option ${i === 0 ? 'active' : ''}" data-size-ml="${s.ml}" data-price="${s.price}">
          ${s.ml}ml
          <span class="price">Rs ${s.price.toLocaleString('en-PK')}</span>
        </button>
      `).join('');

      const related = window.PRODUCTS
        .filter(p => p.collection === product.collection && p.id !== product.id)
        .slice(0, 4);

      const isSaved = window.MF && window.MF.wishlist && window.MF.wishlist.has(product.id);

      container.innerHTML = `
        <div class="product-detail-image-wrap gsap-fade-up">
          <img src="${product.image}" alt="${product.name}" class="product-detail-image">
        </div>
        <div class="product-detail-info gsap-fade-up">
          <span class="label-caps">${product.collection === 'men' ? "Men's Collection" : (product.collection === 'women' ? "Women's Collection" : "Unisex Collection")}${product.badge ? ' · ' + product.badge : ''}</span>
          <h1>${product.name}</h1>
          <div class="product-detail-tagline">${product.tagline}</div>
          <div class="product-detail-price" id="priceDisplay">Rs ${product.sizes[0].price.toLocaleString('en-PK')}</div>
          <p class="product-detail-desc">${product.description}</p>

          <div class="size-selector">
            <span class="label-caps">Select Size</span>
            <div class="size-options" id="sizeOptions">
              ${sizesHtml}
            </div>
          </div>

          <div class="qty-selector">
            <span class="label-caps">Quantity</span>
            <div class="qty-controls">
              <button class="qty-btn" id="qtyMinus" aria-label="Decrease quantity">−</button>
              <span class="qty-value" id="qtyValue">1</span>
              <button class="qty-btn" id="qtyPlus" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <div class="detail-actions-row" style="display:flex; gap:12px; margin-top:24px; align-items:stretch;">
            <button class="btn-add-cart" id="addToCartBtn" data-add-to-cart="${product.id}" data-size-ml="${product.sizes[0].ml}" data-qty="1" style="flex:1;">
              <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
              <span>Add to Cart</span>
            </button>
            <button type="button" class="btn-detail-wishlist ${isSaved ? 'is-active' : ''}" id="detailWishlistBtn" data-wishlist-id="${product.id}" onclick="
              const saved = window.toggleWishlist('${product.id}', this);
              const label = this.querySelector('.wish-text');
              if (label) label.textContent = saved ? 'Saved in Favorites' : 'Save to Favorites';
            ">
              <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
              <span class="wish-text">${isSaved ? 'Saved in Favorites' : 'Save to Favorites'}</span>
            </button>
          </div>

          <div class="product-info-tabs">
            <div class="tab-list">
              <button class="tab-btn active" data-tab="notes">Scent Notes</button>
              <button class="tab-btn" data-tab="details">Details & Longevity</button>
              <button class="tab-btn" data-tab="shipping">Delivery & Care</button>
            </div>
            <div class="tab-panel active" data-panel="notes">
              <p>How <strong>${product.name}</strong> smells throughout the day:</p>
              <div class="notes-grid">
                <div>
                  <h4>Top Notes (First 30 mins)</h4>
                  <p>${product.notes.top}</p>
                </div>
                <div>
                  <h4>Heart Notes (2 to 4 hours)</h4>
                  <p>${product.notes.heart}</p>
                </div>
                <div>
                  <h4>Base Notes (Lasts 12+ hours)</h4>
                  <p>${product.notes.base}</p>
                </div>
              </div>
            </div>
            <div class="tab-panel" data-panel="details">
              <div class="info-rows">
                <div class="info-row"><span class="key">Longevity</span><span class="val">${product.longevity}</span></div>
                <div class="info-row"><span class="key">Projection</span><span class="val">${product.sillage}</span></div>
                <div class="info-row"><span class="key">Best Season</span><span class="val">${product.season}</span></div>
                <div class="info-row"><span class="key">Collection</span><span class="val">${product.collection === 'men' ? "Men's" : (product.collection === 'women' ? "Women's" : "Unisex")}</span></div>
              </div>
            </div>
            <div class="tab-panel" data-panel="shipping">
              <p><strong>Free shipping</strong> across Pakistan on all orders over Rs 10,000.</p>
              <p>Delivery takes 2 to 4 business days. Cash on delivery and online bank transfer are available.</p>
              <p>Each bottle arrives in a luxury gift box with free perfume samples.</p>
            </div>
          </div>
        </div>
      `;

      // Append related products section after grid
      const relatedHtml = related.map(p => window.createProductCardHTML ? window.createProductCardHTML(p) : '').join('');
      const relatedSection = document.createElement('div');
      relatedSection.className = 'related-products container gsap-stagger';
      relatedSection.innerHTML = `
        <h3 style="font-family: var(--font-heading); font-size: 28px; font-weight: 300; margin-bottom: 24px;">You May Also Like</h3>
        <div class="product-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 24px;">${relatedHtml}</div>
      `;
      document.querySelector('.product-detail .container').appendChild(relatedSection);

      // ---------- Size selector ----------
      let selectedSize = product.sizes[0];
      document.querySelectorAll('.size-option').forEach(opt => {
        opt.addEventListener('click', () => {
          document.querySelectorAll('.size-option').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
          selectedSize = product.sizes.find(s => s.ml === parseInt(opt.dataset.sizeMl, 10));
          document.getElementById('priceDisplay').textContent = 'Rs ' + selectedSize.price.toLocaleString('en-PK');
          const btn = document.getElementById('addToCartBtn');
          btn.dataset.sizeMl = selectedSize.ml;
        });
      });

      // ---------- Quantity ----------
      let qty = 1;
      const qtyValue = document.getElementById('qtyValue');
      document.getElementById('qtyMinus').addEventListener('click', () => {
        qty = Math.max(1, qty - 1);
        qtyValue.textContent = qty;
        document.getElementById('addToCartBtn').dataset.qty = qty;
      });
      document.getElementById('qtyPlus').addEventListener('click', () => {
        qty = Math.min(10, qty + 1);
        qtyValue.textContent = qty;
        document.getElementById('addToCartBtn').dataset.qty = qty;
      });

      // ---------- Tabs ----------
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.querySelector(`[data-panel="${btn.dataset.tab}"]`).classList.add('active');
        });
      });

      // Mobile nav toggle is handled globally by js/main.js (initMobileNav)
    })();
  </script>
</body>
</html>
